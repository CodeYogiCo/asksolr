# GoReleaser config — builds asksolr binaries, attaches them to a GitHub
# release on every `vX.Y.Z` tag, and publishes a Homebrew formula to the tap
# at github.com/CodeYogiCo/homebrew-tap.
#
# Local dry run:
#   goreleaser release --snapshot --clean --skip=publish
#
# Real release (CI does this on tag push — see .github/workflows/release.yml):
#   git tag v0.1.0 && git push origin v0.1.0
#
# Required CI secrets:
#   GITHUB_TOKEN        — provided by Actions automatically (release upload)
#   HOMEBREW_TAP_TOKEN  — PAT with `contents: write` on CodeYogiCo/homebrew-tap

version: 2

project_name: asksolr

before:
  hooks:
    - go mod tidy

builds:
  - id: asksolr
    main: ./
    binary: asksolr
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w

archives:
  - id: asksolr
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - AGENTS.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: CodeYogiCo
    name: asksolr
  draft: false
  prerelease: auto

brews:
  - name: asksolr
    repository:
      owner: CodeYogiCo
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/CodeYogiCo/asksolr"
    description: "Agentic Apache Solr CLI — query Solr in plain English using Claude."
    # Uncomment once a LICENSE file is added to the repo:
    # license: "MIT"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "brew: bump asksolr to {{ .Tag }}"
    install: |
      bin.install "asksolr"
    test: |
      system "#{bin}/asksolr", "--help"
