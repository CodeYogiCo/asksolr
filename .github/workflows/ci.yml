name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify gofmt
        run: |
          fmt_out=$(gofmt -l -s .)
          if [ -n "$fmt_out" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (verify clean)
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Unit tests
        run: go test -race -count=1 ./internal/... ./cmd/...

      - name: Build
        run: make build

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Mirrors docker-compose.yml: pre-create the yogi_test core in standalone mode.
      # We can't use Actions `services:` here because that block has no way to
      # override the container CMD, and the default solr:9.7 CMD starts Solr
      # with no cores — which means /solr/admin/ping 404s and integration tests
      # that hit a named collection fail.
      - name: Start Solr
        run: docker run -d --name solr -p 8983:8983 solr:9.7 solr-precreate yogi_test

      - name: Wait for Solr core to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8983/solr/yogi_test/admin/ping > /dev/null; then
              echo "Solr core 'yogi_test' is up"
              exit 0
            fi
            echo "  attempt $i/60 — waiting 2s..."
            sleep 2
          done
          echo "::error::Solr did not become ready in time"
          docker logs solr
          exit 1

      - name: Integration tests
        env:
          SOLR_URL: http://localhost:8983/solr
        run: go test -race -count=1 -tags integration -timeout 120s ./tests/integration/...

      - name: Solr logs (on failure)
        if: failure()
        run: docker logs solr

      - name: Stop Solr
        if: always()
        run: docker rm -f solr
