name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify gofmt
        run: |
          fmt_out=$(gofmt -l -s .)
          if [ -n "$fmt_out" ]; then
            echo "::error::These files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (verify clean)
        run: |
          go mod tidy
          if [ -n "$(git status --porcelain go.mod go.sum)" ]; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: Unit tests
        run: go test -race -count=1 ./internal/... ./cmd/...

      - name: Build
        run: make build

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      solr:
        image: solr:9.7
        ports:
          - 8983:8983
        options: >-
          --health-cmd "curl -f http://localhost:8983/solr/admin/ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Wait for Solr
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8983/solr/admin/info/system > /dev/null; then
              echo "Solr is up"
              exit 0
            fi
            echo "  attempt $i/30 — waiting 2s..."
            sleep 2
          done
          echo "::error::Solr did not become ready in time"
          exit 1

      - name: Integration tests
        env:
          SOLR_URL: http://localhost:8983/solr
        run: go test -race -count=1 -tags integration -timeout 120s ./tests/integration/...
